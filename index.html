<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- Primary Meta Tags -->
    <title>PocketFlow v1.0.0</title>
    <meta name="title" content="PocketFlow | Personal Finance" />
    <meta name="description" content="A minimalist personal expense and income tracker." />
    <meta name="author" content="Ashadul Alam Fardin" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PocketFlow | Personal Finance" />
    <meta property="og:description" content="A minimalist personal expense and income tracker." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="PocketFlow | Personal Finance" />
    <meta property="twitter:description" content="A minimalist personal expense and income tracker." />

    <!-- PWA & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Prevent White Flash (FOUC) -->
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('pocketflow_theme');
          if (localTheme === 'dark' || (!localTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
